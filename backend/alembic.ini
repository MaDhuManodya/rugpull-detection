# alembic.ini — Alembic migration configuration
# DO NOT put secrets here — use DATABASE_URL_SYNC from environment

[alembic]
# Path to migration scripts
script_location = alembic

# Template used for migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Alembic will read the database URL from env.py (which reads from .env)
# Leave sqlalchemy.url blank here — it is set dynamically in env.py
sqlalchemy.url =

[post_write_hooks]
# Automatically format generated migrations with ruff
hooks = ruff
ruff.type = exec
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
